---
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

jobs:
  ci:
    permissions:
      actions: read
      contents: write
      pull-requests: read
      packages: read
      security-events: write
    uses: erik73/workflows/.github/workflows/app-ci.yaml@40570d424036e40cae233428f65e163cf9daa0e9 # v2.0.4

  deploy:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: erik73/workflows/.github/workflows/app-deploy.yaml@40570d424036e40cae233428f65e163cf9daa0e9 # v2.0.4
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
