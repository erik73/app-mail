---
name: Deploy

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  release:
    types:
      - published

permissions: {}

jobs:
  ci:
    permissions:
      actions: read
      contents: write
      pull-requests: read
      packages: read
      security-events: write
    uses: erik73/workflows/.github/workflows/app-ci.yaml@4a2cc513d2b2d61f6b3ec4e795c76e9799f77aed # v2.0.5

  deploy:
    needs: ci
    permissions:
      contents: read
      packages: write
    uses: erik73/workflows/.github/workflows/app-deploy.yaml@4a2cc513d2b2d61f6b3ec4e795c76e9799f77aed # v2.0.5
    secrets:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
